name: source-drift

# Weekly check of the authority sources that skills pin or cite. Findings land
# in one tracking issue. When something needs attention and an
# ANTHROPIC_API_KEY secret exists, an agent proposes the skill updates as a
# draft pull request. No job holds both the agent and a write token:
#
#   check    fetches registries and pages; read-only; uploads the report
#   report   writes the tracking issue; fetches nothing
#   propose  runs the agent; read-only; uploads a patch, never pushes
#   verify   applies the patch and runs the offline checks; read-only; the
#            patch can contain code that tests run, so no token lives here
#   publish  applies the verified patch, pushes a bot branch, opens a draft
#            PR; runs no agent, no patched code, and fetches nothing
#
# See docs/contributing.md#authority-sources and
# docs/decisions/0003-authority-source-drift.md.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.check.outputs.status }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The token only raises the GitHub API rate limit; this job cannot write.
      - name: Check authority sources
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 .github/scripts/check_sources.py \
            --markdown report.md --json report.json
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::error::.github/authority-sources.json is invalid"
            exit 1
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          delimiter="REPORT_$(openssl rand -hex 16)"
          {
            echo "status=$status"
            echo "report<<$delimiter"
            cat report.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Upload the report for the proposal stage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-drift-report
          path: |
            report.json
            report.md
          retention-days: 7
          if-no-files-found: error

  # Separate job so the issue-writing token never shares a process with code
  # that fetches third-party content.
  report:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATUS: ${{ needs.check.outputs.status }}
      REPORT: ${{ needs.check.outputs.report }}
      TITLE: Authority source drift report
    steps:
      - name: Open, update, or close the tracking issue
        run: |
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ "$STATUS" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" \
                --comment "Every authority source is current as of this run."
            fi
            exit 0
          fi
          printf '%s\n' "$REPORT" > report.md
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file report.md
            exit 0
          fi
          gh issue view "$number" --json body --jq .body \
            | grep -v '^_Checked on' > previous.md || true
          grep -v '^_Checked on' report.md > current.md || true
          gh issue edit "$number" --body-file report.md
          if ! diff -qBw previous.md current.md > /dev/null; then
            gh issue comment "$number" \
              --body "Findings changed since the last run; the description holds the current report."
          fi

  # The only job that runs an agent. It reads untrusted pages, so it gets a
  # read-only token, no push credentials, and a narrow tool list. Its output is
  # a patch file that later jobs treat as untrusted input.
  propose:
    needs: check
    if: needs.check.outputs.status == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_patch: ${{ steps.collect.outputs.has_patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether to run the agent
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the agent proposal."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open="$(gh pr list --state open --limit 200 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("bot/source-drift-"))] | length')"
          if [ "$open" != "0" ]; then
            echo "::notice::An open bot/source-drift-* pull request already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Download the drift report
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-drift-report
          path: ${{ runner.temp }}/drift
      # The agent can edit files but run no repository code: the API key is in
      # its environment, so executing scripts it may have edited would expose
      # the key. The sync scripts run in the next step, without the key.
      # github_token is this job's read-only token, so the action needs no
      # OIDC exchange or GitHub App. Schedule and workflow_dispatch runs are
      # not actor-checked by the action.
      - name: Propose updates
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Follow the instructions in .github/prompts/source-drift-review.md.
            The drift report is ${{ runner.temp }}/drift/report.json.
            Write the pull request body to ${{ runner.temp }}/drift/pr-body.md.
          claude_args: |
            --max-turns 60
            --add-dir ${{ runner.temp }}/drift
            --allowedTools "Read,Glob,Grep,Edit,Write,WebFetch,Bash(git diff*),Bash(git status*)"
      - name: Collect the proposal
        id: collect
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/proposal"
          mkdir -p "$out"
          # Restore repository code before running any of it, then regenerate
          # mirrors and adapters from the agent's canonical edits.
          git checkout -- .github/scripts .github/workflows .github/prompts tests
          git clean -fdq -- .github/scripts .github/workflows .github/prompts tests
          python3 .github/scripts/sync_skills.py
          python3 .github/scripts/sync_plugin_adapters.py
          # Stage only the paths the publish job will accept; anything else
          # the agent touched is dropped, and listed below.
          git add -A -- plugins skills .claude-plugin/marketplace.json \
            .agents/plugins/marketplace.json .github/authority-sources.json \
            docs/research
          git diff --cached --binary > "$out/drift.patch"
          echo "Changes left out of the proposal (outside the allowlist):"
          git status --porcelain --untracked-files=all | grep -v '^[MADRC]  ' || true
          if [ ! -s "$out/drift.patch" ]; then
            echo "::notice::The agent proposed no changes."
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$RUNNER_TEMP/drift/pr-body.md"
          if [ -f "$body" ] && [ ! -L "$body" ]; then
            head -c 50000 "$body" > "$out/pr-body.md"
          else
            printf '%s\n' "The agent did not write a summary. Review the diff against the sources in the tracking issue." > "$out/pr-body.md"
          fi
          echo "has_patch=true" >> "$GITHUB_OUTPUT"
      - name: Upload the proposal
        if: steps.collect.outputs.has_patch == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-drift-proposal
          path: ${{ runner.temp }}/proposal
          retention-days: 7
          if-no-files-found: error

  # Tests execute scripts that ship inside plugins/ and skills/, which the
  # patch may change. Run them here, where no write token exists, and keep them
  # out of the publish job.
  verify:
    needs: propose
    if: needs.propose.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-drift-proposal
          path: ${{ runner.temp }}/proposal
      - name: Apply the patch and enforce the path allowlist
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/proposal/drift.patch"
          python3 -I - <<'PY'
          import subprocess
          import sys

          PREFIXES = ("plugins/", "skills/", "docs/research/")
          FILES = {
              ".claude-plugin/marketplace.json",
              ".agents/plugins/marketplace.json",
              ".github/authority-sources.json",
          }
          MODES = {"000000", "100644", "100755"}

          raw = subprocess.run(
              ["git", "diff", "--cached", "--raw", "-z", "--no-renames", "--no-abbrev"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8", "surrogateescape")
          fields = raw.split("\0")
          bad = []
          count = 0
          for meta, path in zip(fields[0::2], fields[1::2]):
              count += 1
              old_mode, new_mode = meta.lstrip(":").split()[:2]
              if not (path.startswith(PREFIXES) or path in FILES):
                  bad.append(path)
              elif not {old_mode, new_mode} <= MODES:
                  bad.append(f"{path} (mode {old_mode} -> {new_mode})")
          if not count:
              print("::error::The patch changes nothing.")
              sys.exit(1)
          if bad:
              print(f"::error::The patch touches paths outside the allowlist: {bad!r}")
              sys.exit(1)
          print(f"{count} changed paths, all inside the allowlist.")
          PY
      - name: Skill mirrors are in sync
        run: python3 .github/scripts/sync_skills.py --check
      - name: Plugin adapters are in sync
        run: python3 .github/scripts/sync_plugin_adapters.py --check
      - name: Authority manifest is valid
        run: python3 .github/scripts/check_sources.py --validate-only
      - name: Test suite
        run: python3 -m unittest discover -s tests

  # Holds the only write token. It applies a patch that verify already
  # accepted, re-checks the path allowlist, and runs nothing from the patch.
  publish:
    needs: [check, propose, verify]
    if: needs.propose.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-drift-proposal
          path: ${{ runner.temp }}/proposal
      - name: Apply the patch and enforce the path allowlist
        run: |
          set -euo pipefail
          git apply --index "$RUNNER_TEMP/proposal/drift.patch"
          python3 -I - <<'PY'
          import subprocess
          import sys

          PREFIXES = ("plugins/", "skills/", "docs/research/")
          FILES = {
              ".claude-plugin/marketplace.json",
              ".agents/plugins/marketplace.json",
              ".github/authority-sources.json",
          }
          MODES = {"000000", "100644", "100755"}

          raw = subprocess.run(
              ["git", "diff", "--cached", "--raw", "-z", "--no-renames", "--no-abbrev"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8", "surrogateescape")
          fields = raw.split("\0")
          bad = []
          count = 0
          for meta, path in zip(fields[0::2], fields[1::2]):
              count += 1
              old_mode, new_mode = meta.lstrip(":").split()[:2]
              if not (path.startswith(PREFIXES) or path in FILES):
                  bad.append(path)
              elif not {old_mode, new_mode} <= MODES:
                  bad.append(f"{path} (mode {old_mode} -> {new_mode})")
          if not count:
              print("::error::The patch changes nothing.")
              sys.exit(1)
          if bad:
              print(f"::error::The patch touches paths outside the allowlist: {bad!r}")
              sys.exit(1)
          print(f"{count} changed paths, all inside the allowlist.")
          PY
      - name: Open the draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          day="$(date -u +%Y-%m-%d)"
          branch="bot/source-drift-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            branch="$branch-$RUN_ID"
          fi
          title="Proposed authority source updates ($day)"
          issues="$SERVER_URL/$GH_REPO/issues?q=is%3Aissue+in%3Atitle+%22Authority+source+drift+report%22"
          # Defuse @-mentions so agent-written text cannot notify anyone.
          head -c 50000 "$RUNNER_TEMP/proposal/pr-body.md" \
            | sed -E 's/@([A-Za-z0-9_-])/@\xe2\x80\x8b\1/g' > "$RUNNER_TEMP/agent-body.md"
          {
            cat "$RUNNER_TEMP/agent-body.md"
            printf '\n\n---\n\n'
            printf '%s\n\n' "This draft was generated by an agent that read untrusted, fetched content. Review every claim against its source before merging."
            printf '%s\n\n' "CI does not run automatically on pull requests opened with the GITHUB_TOKEN. Close and reopen this pull request, or push to the branch, to trigger it."
            printf '%s\n' "Tracking issue: [Authority source drift report]($issues)."
          } > "$RUNNER_TEMP/body.md"
          git checkout -b "$branch"
          git commit -m "Propose authority source updates from source-drift ($day)"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --draft --base main --head "$branch" \
            --title "$title" --body-file "$RUNNER_TEMP/body.md"
