name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every test is unittest-based, so discovery needs no installed
      # dependencies. `python -m pytest` works locally for anyone who has it.
      - name: Run test suite
        run: python -m unittest discover -s tests -v
