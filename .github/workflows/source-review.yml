name: source-review

# Stage 3 of ADR 0003: an agent re-reads only the sources source-drift flags
# and proposes a draft pull request. The agent job cannot write to the
# repository; a separate job publishes its change only after code it cannot
# modify has checked it. See docs/contributing.md#authority-sources.
on:
  workflow_run:
    workflows: [source-drift]
    types: [completed]
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated source ids to review (default every flagged source)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: source-review
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    env:
      CLAUDE_CODE_VERSION: 2.1.290
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether to review
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HAS_MODEL_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          SOURCES: ${{ inputs.sources }}
        run: |
          if [ "$HAS_MODEL_KEY" != "true" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the agent review"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          open="$(gh pr list --state open --json headRefName \
            --jq 'map(select(.headRefName | startswith("source-review/"))) | length')"
          if [ "$open" != "0" ]; then
            echo "::notice::A source-review pull request is already open"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 .github/scripts/check_sources.py \
            --markdown "$RUNNER_TEMP/report.md" --json "$RUNNER_TEMP/report.json"
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then exit 1; fi
          count="$(python3 .github/scripts/source_review.py select \
            --report "$RUNNER_TEMP/report.json" --sources "$SOURCES" \
            --out source-review-brief.json)"
          echo "::notice::$count flagged sources to review"
          if [ "$count" = "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Claude Code
        if: steps.gate.outputs.proceed == 'true'
        run: npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Review flagged sources
        if: steps.gate.outputs.proceed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_DEVELOPER_KNOWLEDGE_API_KEY: ${{ secrets.GOOGLE_DEVELOPER_KNOWLEDGE_API_KEY }}
          MODEL: ${{ vars.SOURCE_REVIEW_MODEL || 'claude-opus-5-5' }}
          MAX_BUDGET_USD: ${{ vars.SOURCE_REVIEW_MAX_BUDGET_USD || '10' }}
        run: |
          # Markdown and manifests only: skills also ship Python that the test
          # suite imports, and the agent's environment holds the API keys.
          allowed=(
            "Edit(plugins/**/*.md)"
            "Edit(plugins/*/*/plugin.json)"
            "Edit(plugins/*/*/.claude-plugin/plugin.json)"
            "Edit(.github/authority-sources.json)"
            "Edit(.claude-plugin/marketplace.json)"
            "Write(source-review-summary.md)"
            "Bash(python3 .github/scripts/sync_skills.py)"
            "Bash(python3 .github/scripts/sync_plugin_adapters.py)"
            "Bash(python3 .github/scripts/check_sources.py --validate-only)"
            "Bash(python3 -m unittest discover -s tests)"
            "Bash(git diff)"
            "Bash(git status)"
            "WebFetch"
            "WebSearch"
          )
          # The key stays a ${...} reference that Claude Code expands itself,
          # so it is never written to disk where the agent could read it.
          if [ -n "$GOOGLE_DEVELOPER_KNOWLEDGE_API_KEY" ]; then
            cat > "$RUNNER_TEMP/mcp.json" <<'JSON'
          {
            "mcpServers": {
              "developer-knowledge": {
                "type": "http",
                "url": "https://developerknowledge.googleapis.com/mcp",
                "headers": {"X-Goog-Api-Key": "${GOOGLE_DEVELOPER_KNOWLEDGE_API_KEY}"}
              }
            }
          }
          JSON
            allowed+=("mcp__developer-knowledge")
          else
            echo '{"mcpServers": {}}' > "$RUNNER_TEMP/mcp.json"
          fi
          claude -p "$(cat .github/source-review-prompt.md)" \
            --bare --strict-mcp-config --mcp-config "$RUNNER_TEMP/mcp.json" \
            --permission-mode dontAsk --allowedTools "${allowed[@]}" \
            --model "$MODEL" --max-budget-usd "$MAX_BUDGET_USD" \
            --output-format json < /dev/null > "$RUNNER_TEMP/claude.json"
          # Claude Code exits 0 even when the run failed; is_error is the signal.
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print({k: r.get(k) for k in ("subtype", "is_error", "num_turns", "total_cost_usd")}); sys.exit(1 if r.get("is_error") else 0)' \
            "$RUNNER_TEMP/claude.json"
      - name: Collect the proposed change
        id: collect
        if: steps.gate.outputs.proceed == 'true'
        run: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::The review created files: $untracked"
            exit 1
          fi
          out="$RUNNER_TEMP/proposal"
          mkdir -p "$out"
          git diff > "$out/change.patch"
          if [ ! -s "$out/change.patch" ]; then
            echo "::notice::The review proposed no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp source-review-summary.md "$out/"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The only step after the agent that sees credentials, and it runs only
      # this repository's own checker.
      - name: Check the change against the allowlist and for credentials
        if: steps.collect.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_DEVELOPER_KNOWLEDGE_API_KEY: ${{ secrets.GOOGLE_DEVELOPER_KNOWLEDGE_API_KEY }}
        run: |
          python3 .github/scripts/source_review.py verify \
            --patch "$RUNNER_TEMP/proposal/change.patch" \
            --summary "$RUNNER_TEMP/proposal/source-review-summary.md"
      - name: Validate the change
        if: steps.collect.outputs.changed == 'true'
        run: |
          python3 .github/scripts/sync_skills.py --check
          python3 .github/scripts/sync_plugin_adapters.py --check
          python3 .github/scripts/check_sources.py --validate-only
          python3 -m unittest discover -s tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.collect.outputs.changed == 'true'
        with:
          name: source-review
          path: ${{ runner.temp }}/proposal
          retention-days: 7

  # Never runs the agent or code the agent wrote: the patch may touch only
  # Markdown and JSON, and is re-checked here before it is applied.
  publish:
    needs: review
    if: needs.review.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      # A token other than GITHUB_TOKEN lets the pull request trigger CI.
      GH_TOKEN: ${{ secrets.SOURCE_REVIEW_TOKEN || github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-review
          path: ${{ runner.temp }}/proposal
      - name: Open a draft pull request
        run: |
          in="$RUNNER_TEMP/proposal"
          python3 .github/scripts/source_review.py verify \
            --patch "$in/change.patch" --summary "$in/source-review-summary.md"
          branch="source-review/$GITHUB_RUN_ID"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git switch --create "$branch"
          git apply --index "$in/change.patch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "Update skills from authority source review" \
            --message "Proposed by $run_url"
          gh auth setup-git
          git push origin "$branch"
          {
            cat "$in/source-review-summary.md"
            printf '\n---\n'
            printf '_Proposed by the [source-review workflow](%s). The agent reads untrusted\n' "$run_url"
            printf 'third-party content: verify the evidence before marking this ready._\n'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --draft --base "$BASE" --head "$branch" \
            --title "Update skills from authority source review" \
            --body-file "$RUNNER_TEMP/body.md"
